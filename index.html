<!DOCTYPE html>
<html>
<head>
    <title>AI Learning Hub</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            display: flex;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background: #1e1e2f;
            color: white;
            height: 100vh;
            padding: 20px;
        }

        .sidebar h2 {
            color: #00ffcc;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            margin: 10px 0;
        }

        .sidebar a:hover {
            color: #00ffcc;
        }

        /* Main Content */
        .content {
            flex: 1;
            padding: 20px;
        }

        /* Header */
        .header {
            background: #00ffcc;
            padding: 10px;
            text-align: center;
        }

        /* Search */
        .search-box {
            width: 60%;
            padding: 10px;
            margin: 20px auto;
            display: block;
        }
    </style>
</head>

<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>AI Hub</h2>
        <a href="#">Python</a>
        <a href="#">Java</a>
        <a href="#">HTML</a>
        <a href="#">CSS</a>
        <a href="#">JavaScript</a>
    </div>

    <!-- Main -->
    <div class="content">

        <div class="header">
            <h1>AI Learning Platform 🤖</h1>
        </div>

        <input class="search-box" placeholder="Search tutorials...">

        <h2>Welcome</h2>
        <p>This is your AI-powered learning website.</p>

        <h3>Python Tutorial</h3>
        <p>Python is easy to learn and powerful...</p>

    </div>

</body>
</html>
